<!DOCTYPE html>
<html>

<head>
    <title>Throttling Example</title>
</head>

<body>

    <button id="btn">Click Me Fast</button>
    <p id="output"></p>

    <script>
        let isThrottled = false;

        document.getElementById("btn").addEventListener("click", function () {
            if (isThrottled) return;

            document.getElementById("output").textContent = "Button click at" + new Data().toLocaleTimeString();

            isThrottled = true;

            setTimeout(() => {
                isThrottled = false;
            }, 400)
        })

    </script>

</body>

</html>
