<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navbar & Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <form onsubmit="handleFormSubmit(event)" novalidate>
            <!-- <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control"> -->
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control">
            <label for="range" class="form-label">Range</label>
            <input type="range" id="range" class="form-range">
            <label for="category" class="form-label">Choose a category</label>
            <select id="category" name="category" class="form-select">
                <option value="">--Select Category--</option>
                <option value="food">Food</option>
                <option value="travel">Travel</option>
                <option value="shopping">Shopping</option>
                <option value="rent">Rent</option>
                <option value="electricity">Electricity</option>
            </select>
            <div class="form-check form-switch form-check-inline">
                <input type="checkbox" class="form-check-input form-switch">
                <label for="check" class="form-check-label">Ackowledge</label>
            </div>
            <div class="form-check form-switch form-check-inline">
                <input type="checkbox" class="form-check-input form-switch">
                <label for="check" class="form-check-label">Ackowledge</label>
            </div>
            <label for="text" class="form-label">Amount</label>

            <div class="input-group">
                <div class="input-group-text">$</div>
                <input type="number" id="text" class="form-control">
                <div class="input-group-text">.00</div>
                <input type="number" id="text" class="form-control">
            </div>
            <div class="input-group">
                <div class="input-group-text">$</div>
                <input type="number" id="text" class="form-control">
                <button class="btn btn-primary">+</button>
            </div>
            <div class="form-floating">
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter email" required>
                <label for="email">Email</label>
                <div class="invalid-feedback">Invalid email</div>
                <div class="valid-feedback">Valid email</div>
            </div>
            <br>
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="submit" class="btn btn-link">Submit</button>
            <button type="submit" class="btn btn-outline-secondary">Submit</button>
            <button type="submit" class="btn btn-primar disabled">Submit</button>
            <a class="btn btn-danger" href="#">Test</a>
            <br>
            <div class="alert alert-success alert-dismissible" role="alert">
                <h1>Alert</h1>
                <a href="#" class="alert-link">Go here for more information</a>
                <button class="btn-close" aria-label="Close" data-bs-dismiss="alert"></button>
            </div>
        </form>
    </div>
    <script>
        const form = document.querySelector("form");

        form.addEventListener('submit', e => {
            if (!form.checkValidity()) {
                e.preventDefault();
            }
            form.classList.add('was-validated')
        })
    </script>
</body>

</html>
