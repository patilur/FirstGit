<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Movie Ticket</title>
    <style>
        body {
            background-color: #f4f6f8;
        }
    </style>
</head>

<body>
    <div class="container" class="container bg-white p-4 rounded shadow">
        <form onsubmit="handleFormSubmit(event)">
            <div class="text-center mb-4">
                <h1>Movie Booking</h1>
                <h3>
                    Total Booking: <span id="totalBooking">0</span>
                </h3>
            </div>
            <div class="row justify-content-center mb-3">
                <div class="col-md-4 text-center">
                    <label for="search" class="form-label">Find slot</label>
                    <input type="search" id="search" class="form-control text-center" placeholder="search seat no..">
                </div>
            </div>

            <div>
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" required />

                <label for="seat" class="form-label">Seat No</label>
                <input type="number" name="seat" id="seat" class="form-control" required />
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>

        </form>


        <table class="table table-bordered mt-4">
            <div class="card-header text-center fw-bold">
                Booking Details
            </div>
            <thead class="table-dark">
                <tr>
                    <th>Username</th>
                    <th>Seat No</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="bookingTableBody">
                <!-- rows will be added here -->
            </tbody>
        </table>
        <!-- <ul></ul> -->
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
<script src="index.js"></script>

</html>
